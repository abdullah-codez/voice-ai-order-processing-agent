<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Agent - Full Duplex</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 50px auto; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; }
        #startBtn { background-color: #4CAF50; color: white; }
        #stopBtn { background-color: #f44336; color: white; display: none; }
        #log { margin-top: 20px; text-align: left; background: #f4f4f9; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <h2>Restaurant Voice Agent</h2>
    <p>Hardware Acoustic Echo Cancellation: <strong>Enabled</strong></p>
    
    <button id="startBtn">Start Call</button>
    <button id="stopBtn">End Call</button>

    <div id="log"></div>

    <script>
        let ws;
        let audioContext;
        let processor;
        let mediaStream;
        
        // --- Audio Queue State ---
        let currentAudio = null;
        let audioQueue = [];
        let isPlaying = false;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logDiv = document.getElementById('log');

        function log(message) {
            logDiv.innerHTML += `<div>${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // --- Audio Queue Logic ---
        function playNextAudio() {
            // Do not play if something is already playing or the queue is empty
            if (isPlaying || audioQueue.length === 0) return;

            isPlaying = true;
            const audioBlob = audioQueue.shift();
            const audioUrl = URL.createObjectURL(audioBlob);
            
            currentAudio = new Audio(audioUrl);
            
            // When the chunk finishes, naturally move to the next one
            currentAudio.onended = () => {
                isPlaying = false;
                playNextAudio();
            };

            // Catch autoplay errors just in case
            currentAudio.play().catch(e => {
                console.error("Audio playback error:", e);
                isPlaying = false;
                playNextAudio();
            });
        }

        function interruptPlayback() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            audioQueue = []; // Instantly clear all buffered sentences
            isPlaying = false;
            log("⚡ <i>Playback interrupted by customer...</i>");
        }

        startBtn.onclick = async () => {
            try {
                // Request Chrome's built-in AEC and noise suppression
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                ws = new WebSocket("ws://localhost:8000/ws");
                
                ws.onopen = () => {
                    log("🟢 Connected to Voice Server");
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'inline-block';

                    // Downsample to 16kHz for our Python VAD
                    audioContext = new AudioContext({ sampleRate: 16000 });
                    const source = audioContext.createMediaStreamSource(mediaStream);
                    
                    // Create a processor to capture raw PCM float32 audio chunks
                    processor = audioContext.createScriptProcessor(2048, 1, 1);
                    
                    processor.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(inputData);
                        }
                    };

                    source.connect(processor);
                    processor.connect(audioContext.destination);
                };

                ws.onmessage = async (event) => {
                    // Check if the server sent a JSON command
                    if (typeof event.data === "string") {
                        const data = JSON.parse(event.data);
                        if (data.action === "interrupt") {
                            interruptPlayback();
                        } else if (data.action === "log") {
                            log(data.message);
                        }
                    } 
                    // Otherwise, it is MP3 audio bytes from the TTS engine
                    else {
                        const audioBlob = new Blob([event.data], { type: 'audio/mpeg' });
                        audioQueue.push(audioBlob); // Push to queue instead of playing immediately
                        playNextAudio();            // Attempt to play
                    }
                };

            } catch (err) {
                log("❌ Error accessing microphone: " + err.message);
            }
        };

        stopBtn.onclick = () => {
            interruptPlayback(); // Ensure the agent stops talking if the user hangs up
            
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (ws) ws.close();
            
            log("🔴 Disconnected");
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        };
    </script>
</body>
</html>
